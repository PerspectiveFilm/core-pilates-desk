<div id="cpd-mount"><p style="font-family:sans-serif;padding:24px;color:#5B6F79">Loading studio desk…</p></div>
<script>
(async function(){
  var m=document.getElementById('cpd-mount'),url='https://raw.githubusercontent.com/PerspectiveFilm/core-pilates-desk/main/desk.html?t='+Date.now();
  try{var r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);m.innerHTML=await r.text();}
  catch(e){m.innerHTML='<p style="font-family:sans-serif;padding:24px">Could not load the studio desk. Check your internet and reload the page.</p>';return}
  var olds=Array.prototype.slice.call(m.querySelectorAll('script'));
  for(var i=0;i<olds.length;i++){var o=olds[i],s=document.createElement('script');
    for(var j=0;j<o.attributes.length;j++)s.setAttribute(o.attributes[j].name,o.attributes[j].value);
    if(o.src){await new Promise(function(ok){s.onload=ok;s.onerror=ok;o.parentNode.replaceChild(s,o)})}
    else{s.textContent=o.textContent;o.parentNode.replaceChild(s,o)}}
})();
</script>
