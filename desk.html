
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>#cpd{
  --bg:#F2F4F5; --surface:#FFFFFF; --sunk:#E8EDEF; --ink:#132D3A; --muted:#5B6F79; --line:#D5DEE2;
  --accent:#132D3A; --accent-ink:#FFFFFF; --accent-soft:#F6E5DC;
  --brand:#D9967A; --navy:#132D3A; --rail-ink:#C9D6DC;
  --ok:#2E7A4E; --ok-soft:#DCEFE3; --warn:#9A6514; --warn-soft:#F6EBD6; --bad:#A93D2C; --bad-soft:#F6DFDA;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  --s-pt:#CFEBD9; --s-pt-ink:#14432A; --s-pt-line:#8FCBA6;
  --s-duo:#2F6FDB; --s-duo-ink:#FFFFFF;
  --s-grp:#EE8A2E; --s-grp-ink:#231205;
  --s-ok:#2E9E5B; --s-ok-ink:#FFFFFF;
}
#cpd{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;text-align:left;letter-spacing:normal;word-spacing:normal;-webkit-font-smoothing:antialiased}
#cpd h1,#cpd h2,#cpd h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
#cpd h1{font-size:1.75rem}
#cpd h2{font-size:1.15rem}
#cpd h3{font-size:1rem}
#cpd .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#cpd .muted{color:var(--muted)}
#cpd .eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
#cpd button,#cpd input,#cpd select,#cpd textarea{font:inherit;color:inherit}
#cpd button{cursor:pointer}
#cpd :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#cpd .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .85rem;font-weight:500}
#cpd .btn:hover{border-color:var(--muted)}
#cpd .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#cpd .btn.primary:hover{filter:brightness(1.08)}
#cpd .btn.danger{color:var(--bad);border-color:var(--bad-soft)}
#cpd .btn.sm{padding:.3rem .6rem;font-size:.85rem}
#cpd .btn:disabled{opacity:.5;cursor:not-allowed}
#cpd .field{display:flex;flex-direction:column;gap:4px;min-width:0}
#cpd .field label{font-size:.78rem;color:var(--muted);font-weight:500}
#cpd input,#cpd select,#cpd textarea{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;width:100%;box-sizing:border-box}
#cpd textarea{min-height:70px;resize:vertical}
#cpd .pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
#cpd .pill.ok{background:var(--ok-soft);color:var(--ok)}
#cpd .pill.warn{background:var(--warn-soft);color:var(--warn)}
#cpd .pill.bad{background:var(--bad-soft);color:var(--bad)}
#cpd .pill.acc{background:var(--accent-soft);color:var(--accent)}
#cpd .app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
#cpd .rail{background:var(--navy);border-right:1px solid var(--navy);color:#fff;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;box-sizing:border-box}
#cpd .brand{display:flex;align-items:center;gap:10px}
#cpd .brand svg{width:38px;height:38px;flex:none}
#cpd .brand div{display:flex;flex-direction:column;gap:1px}
#cpd .brand b{font-family:var(--display);font-size:1.2rem;letter-spacing:-.01em}
#cpd .brand span{font-size:.75rem;color:var(--rail-ink)}
#cpd .brand b{color:#fff}
#cpd .nav{display:flex;flex-direction:column;gap:2px}
#cpd .nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:.55rem .65rem;border-radius:8px;text-align:left;color:var(--rail-ink);font-weight:500}
#cpd .nav button svg{width:18px;height:18px;flex:none}
#cpd .nav button:hover{background:rgb(255 255 255 / .07);color:#fff}
#cpd .nav button[aria-current="page"]{background:rgb(217 150 122 / .16);color:var(--brand)}
#cpd .rail .who .pill{background:rgb(217 150 122 / .18);color:var(--brand)}
#cpd .rail .who .btn{background:transparent;color:#fff;border-color:rgb(255 255 255 / .2)}
#cpd .who{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.85rem}
#cpd .main{padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1560px;width:100%;box-sizing:border-box;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
#cpd .pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
#cpd .pagehead .sub{color:var(--muted);margin-top:4px}
#cpd .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
#cpd .panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
#cpd .grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
#cpd .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#cpd .stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
#cpd .stat .v{font-family:var(--mono);font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums}
#cpd .banner{border-radius:var(--r);padding:10px 14px;background:var(--warn-soft);color:var(--warn);font-weight:500;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
#cpd .banner.info{background:var(--accent-soft);color:var(--accent)}
#cpd .rows{display:flex;flex-direction:column}
#cpd .row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
#cpd .row:first-child{border-top:0}
#cpd .months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
#cpd .mon{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted)}
#cpd .mon b{font-size:.85rem;color:var(--ink);font-weight:500}
#cpd .mon:hover:not(:disabled){border-color:var(--accent)}
#cpd .mon:disabled{opacity:.45;cursor:default}
#cpd .mon.cur{border-color:var(--accent)}
#cpd .mon.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#cpd .mon.on b{color:var(--accent-ink)}
@media (max-width:760px){#cpd .months{grid-template-columns:repeat(6,minmax(0,1fr))}
}
#cpd .tlrow{grid-template-columns:110px minmax(0,1fr) auto}
#cpd .pinbox{display:flex;gap:6px}
#cpd .pinbox input{width:80px;padding:.35rem .5rem}
@media (max-width:760px){#cpd .tlrow{grid-template-columns:minmax(0,1fr)}
}
#cpd .linkbox{display:flex;gap:6px;min-width:0}
#cpd .linkbox input{flex:1;min-width:0;font-family:var(--mono);font-size:.78rem;padding:.35rem .5rem}
#cpd .notegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
#cpd .note{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk);min-width:0}
#cpd .fin{font-size:.85rem}
#cpd .fin th.fname{position:sticky;left:0;background:var(--surface);z-index:1;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink);font-weight:500;white-space:nowrap;min-width:170px}
#cpd .fin thead th{background:var(--surface)}
#cpd .fin td{padding:2px 3px}
#cpd .fin tr.sec th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-top:14px}
#cpd .fin .cell{width:96px;text-align:right;border:1px solid transparent;background:transparent;padding:.35rem .4rem;border-radius:6px}
#cpd .fin .cell:hover{border-color:var(--line)}
#cpd .fin .cell:focus{background:var(--sunk);border-color:var(--accent);outline:none}
#cpd .fin td.tot{font-weight:600;padding-right:10px}
#cpd .fin tr.sum td,#cpd .fin tr.sum th{background:var(--sunk);font-weight:700;padding:9px 10px}
#cpd .fin tr.sum th.fname{background:var(--sunk);font-weight:700}
#cpd .fin tr.sales th.fname{font-weight:700;color:var(--accent)}
#cpd .fin tr.ref td,#cpd .fin tr.ref th{color:var(--muted);font-size:.78rem;padding:8px 10px}
#cpd .fin tr.ref th.fname{color:var(--muted)}
#cpd .frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
#cpd .frow:first-child{border-top:0}
#cpd .frow label{font-size:.9rem;color:var(--ink);font-weight:400}
#cpd .frow .cell{width:150px;text-align:right;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:.4rem .5rem}
#cpd .frow .cell:focus{border-color:var(--accent);outline:none}
#cpd .frow.total{font-weight:700;font-size:1rem;border-top:2px solid var(--line);padding-top:10px}
#cpd .tl{min-width:1750px;display:flex;flex-direction:column}
#cpd .vgrid{display:grid;min-width:min-content}
#cpd .vhead{position:sticky;top:0;z-index:3;background:var(--surface);padding:10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:.9rem;text-align:center}
#cpd .vcorner{border-left:0;left:0;z-index:4}
#cpd .vhours{margin-bottom:16px;position:sticky;left:0;background:var(--surface);z-index:2}
#cpd .vhours span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--mono);font-size:.72rem;color:var(--muted)}
#cpd .vhours span:first-child{transform:none}
#cpd .vtrack{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 64px)!important;margin:0 0 16px!important;cursor:default}
#cpd .vtrack.canadd{cursor:copy}
#cpd .vblk{position:absolute;left:4px;right:4px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:1px;padding:3px 7px!important;border-radius:7px!important;overflow:hidden;text-align:left;font-family:var(--body)!important;font-size:.74rem!important;line-height:1.2;box-shadow:0 1px 2px rgb(0 0 0 / .08);z-index:1}
#cpd .vblk b{font-family:var(--mono);font-size:.72rem;font-weight:600}
#cpd .vblk span{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#cpd .vnow{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
#cpd .tlrowx{display:grid;grid-template-columns:140px minmax(0,1fr);border-bottom:1px solid var(--line);min-height:58px}
#cpd .tlrowx:last-child{border-bottom:0}
#cpd .tlname{position:sticky;left:0;z-index:2;background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:1px solid var(--line);font-size:.9rem}
#cpd .tlname span{font-size:.75rem}
#cpd .tltrack{position:relative;margin-right:28px;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100%/14));cursor:default}
#cpd .tltrack.canadd{cursor:copy}
#cpd .tlhead{min-height:34px}
#cpd .tlhead .tltrack{background:none}
#cpd .tlh{position:absolute;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:.72rem;color:var(--muted)}
#cpd .tlh:first-child{transform:translate(4px,-50%)}
#cpd .blk{position:absolute;top:6px;bottom:6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:2px 7px!important;border-radius:7px!important;overflow:hidden;text-align:left;font-family:var(--body)!important;font-size:.74rem!important;line-height:1.2;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
#cpd .blk b{font-family:var(--mono);font-size:.72rem;font-weight:600}
#cpd .blk span{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#cpd .tlnow{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1;pointer-events:none}
#cpd .autorow th.fname,#cpd .frow.autorow label{color:var(--accent)}
#cpd .tick{display:grid;place-items:center;cursor:pointer;position:relative}
#cpd .tick input{position:absolute;opacity:0;width:1px;height:1px}
#cpd .tick span{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
#cpd .tick input:checked+span{background:var(--ok);border-color:var(--ok)}
#cpd .tick input:checked+span::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
#cpd .tick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
#cpd .callrow.done b{text-decoration:line-through;color:var(--muted)}
#cpd .callrow.done{opacity:.75}
#cpd .snum{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--sunk);color:var(--muted);font:700 .68rem var(--mono);vertical-align:1px;margin-left:4px;box-sizing:border-box}
#cpd .snum.zero{background:var(--bad);color:#fff}
#cpd .leftnum{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--bad);color:#fff;font-family:var(--mono);font-weight:700;font-size:.9rem;box-sizing:border-box}
#cpd .linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;font-size:.76rem;cursor:pointer}
#cpd .linkbtn:hover{text-decoration:underline}
#cpd .form input,#cpd .form select{height:40px;box-sizing:border-box}
#cpd input[type=date],#cpd input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;height:40px;line-height:1.2;font:inherit;text-align:left}
#cpd input[type=date]::-webkit-date-and-time-value,#cpd input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
@media(max-width:640px){#cpd #bookForm{grid-template-columns:1fr 1fr!important}
#cpd #bookForm .field{min-width:0}
#cpd #bookForm input,#cpd #bookForm select{font-size:16px}
}
#cpd .cphint{position:absolute;top:100%;left:2px;margin-top:3px;font-size:.74rem;line-height:1.2;color:var(--muted);white-space:nowrap;pointer-events:none}
#cpd #qsForm,#cpd #saleForm{row-gap:22px;padding-bottom:16px}
#cpd .cphint.ok{color:var(--ok)}
#cpd .cphint.new{color:var(--brand);font-weight:600}
#cpd .bdays{display:flex;gap:8px;flex-wrap:wrap}
#cpd .bd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
#cpd .bd span{font-size:.78rem;color:var(--muted)}
#cpd .bd.today{background:var(--accent-soft);border-color:var(--brand)}
#cpd .bd.today b{color:var(--ink)}
#cpd .bd:hover{border-color:var(--brand)}
#cpd .expadd{display:grid;grid-template-columns:160px minmax(0,1fr) 120px auto;gap:8px;margin-bottom:10px}
#cpd .expadd input,#cpd .expadd select{height:38px;box-sizing:border-box}
@media (max-width:600px){#cpd .expadd{grid-template-columns:1fr 1fr}
#cpd .expadd #exNote{grid-column:1/-1;order:3}
}
#cpd .exrow{display:grid;grid-template-columns:60px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
#cpd .exrow:first-child{border-top:0}
#cpd .xbtn{border:0;background:none;color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;padding:0}
#cpd .xbtn:hover{color:var(--bad)}
#cpd .regform{border-top:1px solid var(--line);padding-top:14px}
#cpd .rf{display:flex;flex-direction:column;gap:6px;margin:0}
#cpd .rfrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;font-size:.88rem}
#cpd .rfrow dt{color:var(--muted)}
#cpd .rfrow dd{margin:0;display:flex;flex-wrap:wrap;gap:4px}
#cpd .hbox{background:var(--bad-soft);color:var(--ink);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.88rem;margin-bottom:10px}
#cpd .hbox>b{color:var(--bad)}
#cpd .hflag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:1px 6px;margin-left:4px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
#cpd .rfedit{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#cpd .rfedit summary{cursor:pointer}
#cpd .rfav th,#cpd .rfav td{padding:4px 6px;text-align:center;font-size:.78rem}
#cpd .rfav tbody th{text-align:left;text-transform:none;letter-spacing:0;color:var(--ink)}
#cpd .rfav input{width:18px!important;height:18px!important}
#cpd .pkglist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px}
#cpd .pkgrow{display:grid;grid-template-columns:auto 2.5ch minmax(0,1.6fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:.86rem}
#cpd .pkgrow:first-child{border-top:0}
#cpd .pkgrow.cur{background:var(--accent-soft)}
@media (max-width:600px){#cpd .pkgrow{grid-template-columns:auto 2.5ch minmax(0,1fr)}
#cpd .pkgrow>span:nth-child(n+4){grid-column:1/-1}
}
#cpd .minis{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:8px}
#cpd .minis b{color:var(--ink)}
#cpd .pkgedit{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--accent-soft)}
#cpd .btn.burned{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
#cpd #clientForm :disabled{opacity:1;color:var(--ink);background:var(--surface);cursor:default}
#cpd html.modal-open,#cpd html.modal-open body{overflow:hidden}
#cpd .overlay{overscroll-behavior:contain}
#cpd .trchk{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
#cpd .trchk input{width:auto!important;height:auto!important;margin:0}
#cpd .gdot{display:inline-block;width:10px;height:10px;border-radius:5px}
#cpd .gspots{color:#fff;font:700 .9rem var(--mono);padding:3px 10px;border-radius:99px;white-space:nowrap}
#cpd .gcard{gap:10px}
#cpd .rowlink{cursor:pointer}
#cpd .rowlink:hover{background:var(--sunk)}
#cpd .row .t{font-family:var(--mono);font-size:.95rem}
#cpd .fill{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px;max-width:220px}
#cpd .fill i{display:block;height:100%;background:var(--accent)}
#cpd .fill.full i{background:var(--warn)}
#cpd .tablewrap{overflow-x:auto}
#cpd table{width:100%;border-collapse:collapse;font-size:.9rem}
#cpd th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
#cpd td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
#cpd tbody tr.click{cursor:pointer}
#cpd tbody tr.click:hover td{background:var(--sunk)}
#cpd td.r,#cpd th.r{text-align:right}
#cpd .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#cpd .chips{display:flex;gap:6px;flex-wrap:wrap}
#cpd .chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.3rem .75rem;font-size:.85rem;color:var(--muted)}
#cpd .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#cpd .empty{padding:28px 12px;text-align:center;color:var(--muted)}

function finChart(selYr){
  const cy=new Date().getFullYear(),YRS=[];for(let y2=FIN_FIRST;y2<=cy;y2++)YRS.push(y2);
  const TT=YRS.map(finTotals);let T={sales:TT.map(o=>o.Sa),cost:TT.map(o=>o.C)},MONTHS=YRS.map(String),N=YRS.length,yearly=true;

    <line x1="${l}" x2="${W-r}" y1="${y0}" y2="${y0}" style="stroke:var(--muted)" stroke-width="1.2"/>

const TL0=7*60,TL1=21*60;

const COL_NAMES={classes:'Session',clients:'Client',payments:'Payment',staff:'Staff',settings:'Settings',expenses:'Expense',notes:'Note',finances:'Finances'};
function docLabel(col,d){if(!d)return '';return col==='clients'||col==='staff'?d.name:col==='payments'?[d.name||(d.client&&S.clients[d.client]?.name)||'',d.item,d.amount!=null?L(d.amount):''].filter(Boolean).join(' · '):col==='expenses'?[d.note,L(d.amount)].join(' · '):col==='classes'?[d.date,d.time,typeName(d.type),staffName(d.instructor)].filter(Boolean).join(' · '):col==='finances'?'Year '+(d.year||''):col==='notes'?String(d.text||'').slice(0,60):''}
const shortV=v=>{if(v==null||v==='')return '—';if(Array.isArray(v))return v.length+' item'+(v.length===1?'':'s');if(typeof v==='object')return '…';const t=String(v);return t.length>40?t.slice(0,40)+'…':t};
function diffOf(col,a,b){const out=[];const keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  for(const k of keys){if(['ts','form','packages','booked'].includes(k)&&col!=='classes'){if(JSON.stringify((a||{})[k])!==JSON.stringify((b||{})[k])&&k!=='ts')out.push(k+' changed');continue}
    if(k==='booked'){const n1=((a||{}).booked||[]).map(x=>S.clients[x.c]?.name||'?'),n2=((b||{}).booked||[]).map(x=>S.clients[x.c]?.name||'?');const add=n2.filter(x=>!n1.includes(x)),rem=n1.filter(x=>!n2.includes(x));if(add.length)out.push('booked '+add.join(', '));if(rem.length)out.push('removed '+rem.join(', '));const bu=((b||{}).booked||[]).filter(x=>x.burn).length-((a||{}).booked||[]).filter(x=>x.burn).length;if(bu>0)out.push('burned a session');if(bu<0)out.push('removed a burn');continue}
    const x=(a||{})[k],y=(b||{})[k];if(JSON.stringify(x)!==JSON.stringify(y))out.push(k+': '+shortV(x)+' → '+shortV(y))}
  return out.slice(0,8).join('; ')}
function audited(st){
  const who=()=>UI.role==='trainer'?staffName(UI.trainer)+' (trainer)':(PERMS[UI.role]||{}).label||'Unknown';
  const log=(action,col,id,before,after)=>{if(UI.importing||col==='log'||(col==='settings'&&/^hist|^fx/.test(id)))return;
    const e={ts:Date.now(),who:who(),action,col,id,label:docLabel(col,after||before)||id,changes:action==='edited'?diffOf(col,before,after):''};
    if(action==='edited'&&!e.changes)return;try{st.set('log',uid(),e)}catch{}};
  return{...st,
    async set(c,i,d){const before=S[c]?.[i]?{...S[c][i]}:null;const r=await st.set(c,i,d);log(before?'edited':'added',c,i,before,d);return r},
    async upd(c,i,d){const before=S[c]?.[i]?{...S[c][i]}:null;const r=await st.upd(c,i,d);log('edited',c,i,before,{...(before||{}),...d});return r},
    async del(c,i){const before=S[c]?.[i]?{...S[c][i]}:null;const r=await st.del(c,i);log('deleted',c,i,before,null);return r}};
}

async function recordSale(clientId,prodKey,amount,method,dt,tm,paidNow,note){
  const pr=PRODUCTS.find(x=>x.k===prodKey),d=dt||today(),when=new Date(d+'T'+(tm||new Date().toTimeString().slice(0,5))+':00').getTime()||Date.now();
  const total=+amount||0,paid=paidNow===''||paidNow==null?total:Math.max(0,Math.min(total,+paidNow||0)),rec={kind:pr.c||pr.unl?'package':'product',date:d,ts:when,client:clientId||'',item:pr.n,amount:paid,method,by:UI.role};if(note&&note.trim())rec.note=note.trim();
  if(paid<total){rec.owed=total-paid;rec.total=total;if(!paid)rec.unpaid=true}
  const ok=await save(()=>store.set('payments',uid(),rec));
  if(ok&&paid<total)toast((S.clients[clientId]?.name||'Client')+' owes '+L(total-paid)+' \u2014 added to Debtors');
  if(!ok)return false;
  if(clientId){
    const c=S.clients[clientId]||{},up={plan:pr.n};

      if(v.length<6){$('#loginErr').textContent='Codes are at least 6 characters.';return}
      $('#loginErr').textContent='Signing in\u2026';
      try{await FB.auth.signInWithEmailAndPassword(email,v)}catch(e){$('#loginErr').textContent=/wrong-password|invalid-credential|invalid-login|user-not-found/.test(e.code||'')?'That code doesn\u2019t match. Try again.':/too-many/.test(e.code||'')?'Too many tries. Wait a minute and try again.':'Could not sign in: '+(e.message||e.code);$('#pin').value='';$('#pin').focus()}
      return}
    if(UI.lockTrainer||UI.loginRole==='trainer'){
      const tid=UI.lockTrainer||$('#loginTrainer')?.value,st=S.staff[tid];
      if(st&&v&&v===String(st.pin||'4444')){UI.role='trainer';UI.trainer=tid;ss.set('cp_role','trainer');ss.set('cp_trainer',tid);UI.page='team';render()}
      else{$('#loginErr').textContent='That PIN doesn\u2019t match '+(st?st.name:'this trainer')+'. Try again.';$('#pin').value='';$('#pin').focus()}
      return;
    }
    if(v&&v===pins()[UI.loginRole]){UI.role=UI.loginRole;ss.set('cp_role',UI.role);UI.page='dash';render()}
    else{$('#loginErr').textContent='That PIN doesn’t match the '+PERMS[UI.loginRole].label+' PIN. Try again.';$('#pin').value='';$('#pin').focus()}
  }
  if(f.id==='finAdd'){const n=$('#finNew').value.trim();if(!n){toast('Type a name for the cost line.');return}
    const yr=UI.finYear||new Date().getFullYear();
    if(finDoc(yr).rows.some(r=>r.name.toLowerCase()===n.toLowerCase())){toast('That line already exists.');return}
    await finSave(yr,d=>{const i=d.rows.findIndex(r=>r.name==='Paychecks');d.rows.splice(i<0?d.rows.length:i,0,{name:n,m:{}})});return}
  if(f.id==='noteForm'){
    const text=$('#ntText').value.trim();if(!text){toast('Write a note first.');return}
    if(await save(()=>store.set('notes',uid(),{trainer:f.dataset.tid,client:$('#ntClient').value,text,ts:Date.now(),by:UI.role}),'Note saved'))$('#ntText').value='';
    return;
  }
  if(f.id==='bookForm'){
    const tid=f.dataset.tid,type=$('#bkType').value,date=$('#bkDate').value,time=$('#bkTime').value,k=kindOf(type);
    if(!date||!time){toast('Pick a date and time.');return}
    const ids=[$('#bkC1')?.value,$('#bkC2')?.value].filter(Boolean);
    if(k!=='grp'&&!ids.length){toast('Choose a client.');return}
    if(k==='duo'&&ids.length<2){toast('Choose both clients for a duo.');return}
    if(new Set(ids).size<ids.length){toast('Pick two different clients.');return}
    if(Object.values(S.classes).some(c=>c.instructor===tid&&c.date===date&&c.time===time)){toast(staffName(tid)+' already has a session at '+time+' that day.');return}
    const cap=k==='duo'?2:k==='grp'?6:1;
    if(await save(()=>store.set('classes',uid(),{date,time,dur:50,type,instructor:tid,cap,booked:ids.map(c=>({c,u:false,in:false}))}),'Session booked \u00b7 on the Schedule now')){UI.bookDate=date;UI.bookTime=time}
    return;
  }
  if(f.id==='expForm'){
    const amt=+$('#exAmt').value,date=$('#exDate').value;
    if(!date){toast('Pick a date.');return}
    if(!(amt>0)){toast('Enter the amount in Lek.');return}
    if(await save(()=>store.set('expenses',uid(),{date,cat:$('#exCat').value,note:$('#exNote').value.trim(),amount:amt,ts:Date.now(),by:UI.role}),'Expense added')){$('#exAmt').value='';$('#exNote').value=''}
    return;
  }
  if(f.id==='qsForm'){
    const amt=$('#qsAmt').value;if(amt===''||+amt<0){toast('Enter an amount in Lek.');return}
    if(!$('#qsClient').value.trim()){toast('Type the client\u2019s name.');$('#qsClient').focus();return}
    const full=fullPrice('qsClient','qsProd');const cid=await ensureClient($('#qsClient').value);if(!cid)return;
    if(await recordSale(cid,$('#qsProd').value,Math.max(+amt,full),$('#qsMethod').value,$('#qsDate').value,null,+amt<full?amt:null)){UI.dashPayDay=today();if(P().revenue)UI.chartMode='day';UI.qsReset=true;UI.amtManual={};render()}
    return;
  }
  if(f.id==='saleForm'){
    const amt=$('#sAmt').value;if(amt===''||+amt<0){toast('Enter an amount in Lek.');return}
    if(!$('#sClient').value.trim()){toast('Type the client\u2019s name.');$('#sClient').focus();return}
    const full=fullPrice('sClient','sProd');const cid=await ensureClient($('#sClient').value);if(!cid)return;
    if(await recordSale(cid,$('#sProd').value,Math.max(+amt,full),$('#sMethod').value,$('#sDate').value,null,+amt<full?amt:null,$('#sNote').value)){$('#sClient').value='';$('#sNote').value='';cpHint($('#sClient'));UI.amtManual={}}
  }
  if(f.id==='classForm'){
    const id=f.dataset.id,d={type:$('#cType').value,instructor:$('#cInst').value,date:$('#cDate').value,time:$('#cTime').value,dur:c0dur(id),cap:Math.max(1,+$('#cCap').value||1)};
    if(id){if(await save(()=>store.upd('classes',id,d),'Session updated'))classModal(id)}
    else{const names=[...document.querySelectorAll('#cCliWrap [data-cpick]')].map(x=>x.value.trim()).filter(Boolean);const ids=[];for(const nm of names){const cid=await ensureClient(nm);if(cid&&!ids.includes(cid))ids.push(cid)}
      d.cap=Math.max(d.cap,ids.length);
      if(await save(()=>store.set('classes',uid(),{...d,booked:ids.map(c=>({c,in:false,u:false}))}),'Session added')){closeModal();UI.week=monday(d.date);UI.schedDay=d.date;render()}}
  }
  if(f.id==='clientForm'){
    const id=f.dataset.id,d={name:$('#clName').value.trim(),phone:$('#clPhone').value.trim(),emergency:$('#clEmer').value.trim(),email:$('#clEmail').value.trim(),nationality:$('#clNat').value.trim(),source:$('#clSrc').value,discType:$('#clDisc')?$('#clDisc').value:'',discPct:$('#clDisc')&&$('#clDisc').value==='other'?Math.max(0,Math.min(100,+$('#clDiscPct').value||0)):0,birthday:$('#clBday').value,trainers:[...document.querySelectorAll('input[name=clTr]:checked')].map(x=>x.value),packageStart:$('#clStart').value,expires:$('#clExp').value};
    if(!d.name){toast('Enter the client’s name.');return}
    {const rf=readRegForm(id?S.clients[id]?.form:null);if(rf)d.form=rf}
    if($('#clPrev'))d.sessionsBefore=Math.max(0,+$('#clPrev').value||0);
    if($('#clLeft'))d.credits=(+$('#clLeft').value||0)+(id&&d.packageStart===S.clients[id]?.packageStart?usedOf(id):0);
    if($('#clPType')){const t=$('#clPType').value,n=+$('#clPN').value||0;d.plan=t?t+(n?' \u00b7 '+n:''):'';if(t)d.active=true}
    if(id){if(await save(()=>store.upd('clients',id,d),'Client saved'))closeModal()}
    else{const nid=uid();if(await save(()=>store.set('clients',nid,{credits:0,plan:'',...d,joined:today()}),'Client added')){const pt=UI.pickTarget;UI.pickTarget=null;if(pt&&document.getElementById(pt)){closeModal();const el=document.getElementById(pt);el.value=d.name;setTimeout(()=>{const e2=document.getElementById(pt);if(e2){e2.value=d.name;cpHint(e2)}},400)}else clientModal(nid)}}
  }
  if(f.id==='staffForm'){
    const id=f.dataset.id,d={name:$('#stName').value.trim(),role:$('#stRole').value,phone:$('#stPhone').value.trim(),email:$('#stEmail').value.trim(),birthday:$('#stBday').value,age:$('#stBday').value?ageOf($('#stBday').value):($('#stAge').value?+$('#stAge').value:''),address:$('#stAddr').value.trim()};
    if($('#stPin')){const pv=$('#stPin').value.trim();if(pv&&!/^\d{4,6}$/.test(pv)){toast('PIN must be 4 to 6 digits.');return}d.pin=pv}
    if($('#stRate'))d.rate=+$('#stRate').value||0;
    if(!d.name){toast('Enter a name.');return}
    if(await save(()=>id?store.upd('staff',id,d):store.set('staff',uid(),d),id?'Saved':'Staff added'))closeModal();
  }
  if(f.id==='pinForm'){
    const v={owner:$('#pin_owner').value.trim(),manager:$('#pin_manager').value.trim(),reception:$('#pin_reception').value.trim()};
    if(Object.values(v).some(x=>!/^\d{4,6}$/.test(x))){toast('PINs must be 4 to 6 digits.');return}
    if(new Set(Object.values(v)).size<3){toast('Use a different PIN for each role.');return}
    await save(()=>store.set('settings','pins',v),'PINs saved');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('cell')){e.preventDefault();e.target.blur();return}if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});

let toastT;function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.getElementById('cpd').appendChild(el)}el.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3200)}

/* ---------- boot ---------- */
(async()=>{
  const readHash=()=>{const m=/^#trainer-([A-Za-z0-9_.~-]+)$/.exec(location.hash||'');UI.lockTrainer=m?m[1]:null};readHash();
  window.addEventListener('hashchange',()=>{readHash();UI.role=null;render()});
  const saved=FB?null:ss.get('cp_role');if(saved&&PERMS[saved]){UI.role=saved;if(saved==='trainer'){UI.trainer=ss.get('cp_trainer');if(!UI.trainer)UI.role=null}}
  if(UI.lockTrainer&&!(UI.role==='trainer'&&UI.trainer===UI.lockTrainer)){UI.role=null;UI.trainer=null}
  render();
  if(FB){store=audited(dbStore(FB.fs));fbStart(render);return}
  let db=null,user=null;
  for(let i=0;i<20&&!window.claude?.use;i++)await new Promise(r=>setTimeout(r,100));
  try{if(window.claude?.use)[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch{}
  try{viewerIsOwner=user?!!(await user.isOwner()):false}catch{}
  store=audited(db?dbStore(db):memStore());
  for(const c of['classes','clients','payments','staff','settings','expenses','notes','finances','log','groups'])store.sub(c,o=>{S[c]=o;if(!UI.importing)render()});
  UI.loaded=true;render();
})();
</script>
